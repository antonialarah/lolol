<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gráfico de Barras Horizontales Agrupadas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div style="width: 80%; margin: auto;">
        <canvas id="graficoProfesores"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('graficoProfesores').getContext('2d');

        const data = {
            // Los profesores serán nuestro eje vertical (Y)
            labels: [
                'Pablo Domínguez González',
                'Leonardo Soto Calquín',
                'Jenny Abud Carrillo',
                'Sebastián Pagueguy Fenner',
                'Gabriela Pradenas Guentherodt'
            ],
            // Cada dataset representa una tendencia (las barras agrupadas)
            datasets: [
                {
                    label: 'Ecología Materialidad y Futuros',
                    data: [13, 2, 2, 2, 1], // Orden idéntico al de las labels
                    backgroundColor: 'rgba(54, 162, 235, 0.7)', // Azul
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                },
                {
                    label: 'Educación Activismo y Género',
                    data: [4, 5, 5, 1, 1],
                    backgroundColor: 'rgba(255, 99, 132, 0.7)', // Rosado
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                },
                {
                    label: 'Salud Cuidado y Neurodiversidad',
                    data: [20, 3, 1, 3, 2],
                    backgroundColor: 'rgba(75, 192, 192, 0.7)', // Verde menta
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                },
                {
                    label: 'Tecnología Interacción y Medios',
                    data: [5, 1, 2, 3, 1],
                    backgroundColor: 'rgba(255, 206, 86, 0.7)', // Amarillo
                    borderColor: 'rgba(255, 206, 86, 1)',
                    borderWidth: 1
                },
                {
                    label: 'Territorio Identidad y Memoria',
                    data: [1, 3, 1, 1, 1],
                    backgroundColor: 'rgba(153, 102, 255, 0.7)', // Morado
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }
            ]
        };

        const config = {
            type: 'bar', // En Chart.js, las barras horizontales usan tipo 'bar'
            data: data,
            options: {
                indexAxis: 'y', // <-- CLAVE: Esto vuelve las barras horizontales
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top', // Posición de las leyendas de tendencias
                    },
                    title: {
                        display: true,
                        text: 'Cantidad de Tendencias por Profesor'
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Cantidad'
                        }
                    }
                }
            }
        };

        // Renderizar el gráfico
        new Chart(ctx, config);
    </script>
</body>
</html>
